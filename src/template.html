<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ариун Куран</title>
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Ариун Куран — Кураны араб эх ба монгол утга агуулга. Унших, сонсох, хайх, тэмдэглэх.">
<meta name="theme-color" content="#0f5c4a">
<!--PWA-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Scheherazade+New:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&family=Golos+Text:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
/*CSS*/
</style>
</head>
<body>
<div class="boot" id="boot"><div><div class="sp2"></div>Ариун Куран</div></div>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><div class="logo"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="9" y="9" width="22" height="22"/><rect x="9" y="9" width="22" height="22" transform="rotate(45 20 20)"/><circle cx="20" cy="20" r="5.5"/><circle cx="20" cy="20" r="1.6" fill="currentColor"/></svg></div><div><b data-t="app"></b><small>القرآن الكريم</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="prog"><span data-t="hatim"></span> · <b id="hpct">0%</b><div class="bar"><i id="hbar" style="width:0"></i></div></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top" id="top">
      <button class="ib menu-b" id="menuB" aria-label="menu"></button>
      <div class="grp sel">
        <select id="selS" aria-label="surah"></select>
        <select id="selA" aria-label="ayah"></select>
        <select id="selJ" aria-label="juz" class="hide-m"></select>
      </div>
      <div class="pnav hide-m"><button id="tpNext" aria-label="next"></button><input id="tpIn" inputmode="numeric" aria-label="page"><button id="tpPrev" aria-label="prev"></button></div>
      <div class="seg" id="viewSeg"><button data-v="quran"></button><button data-v="both"></button><button data-v="meal"></button></div>
      <select id="selV" aria-label="view"></select>
      <span class="sp"></span>
      <div class="grp acts-top">
        <button class="ib" id="playTB"></button>
        <button class="ib lang" id="langB"></button>
        <button class="ib" id="bmB"></button>
        <button class="ib" id="savedB"></button>
        <button class="ib" id="notesB"></button>
        <button class="ib" id="copyB"></button>
        <button class="ib" id="setB"></button>
        <button class="ib" id="fsB"></button>
      </div>
    </header>
    <div class="wrap">
      <section class="view" id="v-home"></section>
      <section class="view" id="v-read"></section>
      <section class="view" id="v-surahs"></section>
      <section class="view" id="v-juz"></section>
      <section class="view" id="v-search"></section>
      <section class="view" id="v-saved"></section>
      <section class="view" id="v-notes"></section>
      <section class="view" id="v-help"></section>
      <section class="view" id="v-elifba"></section>
      <section class="view" id="v-dict"></section>
      <section class="view" id="v-topics"></section>
      <section class="view" id="v-intro"></section>
    </div>
  </div>
</div>
<button class="side-arrow" id="saL" style="left:266px" aria-label="next"></button>
<button class="side-arrow" id="saR" style="right:16px" aria-label="prev"></button>
<div class="mbar" id="mbar">
  <div class="pnav"><button id="mbNext" aria-label="next"></button><input id="mbIn" inputmode="numeric" aria-label="page"><button id="mbPrev" aria-label="prev"></button></div>
  <button class="ib" id="mbPlay" aria-label="play"></button>
  <button class="ib" id="mbRead" aria-label="read"></button>
  <button class="ib" id="mbMore" aria-label="more"></button>
</div>
<div class="player" id="player"></div>
<div class="plcap" id="plcap" aria-live="polite"></div>
<div class="ov" id="ov"></div>
<div class="sheet" id="sheet"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"></div>
<div class="selbar" id="selbar"></div>
<input type="file" id="fileIn" accept=".txt,.json,.csv,.tsv,text/plain,application/json" hidden>
<!--INLINE-->
<script src="content.js"></script>
<script src="app.js"></script>
</body>
</html>
